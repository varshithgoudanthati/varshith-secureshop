{% extends "base.html" %}
{% block title %}400 Bad Request — SecureShop{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="glass-card p-5 mx-auto" style="max-width: 550px;">
        <div class="display-3 mb-3">⚠️</div>
        <h1 class="h3 text-light fw-bold mb-2">400 — Bad Request</h1>
        <p class="text-secondary small mb-4">
            {{ error.description or 'Your browser sent an invalid or malformed request. (e.g., missing or invalid CSRF token).' }}
        </p>
        <a href="{{ url_for('products.index') }}" class="btn btn-primary-gradient">Return to Home</a>
    </div>
</div>
{% endblock %}
