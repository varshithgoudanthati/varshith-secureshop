{% extends "base.html" %}
{% block title %}404 Not Found — SecureShop{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="glass-card p-5 mx-auto" style="max-width: 550px;">
        <div class="display-3 mb-3">🔍</div>
        <h1 class="h3 text-light fw-bold mb-2">404 — Page Not Found</h1>
        <p class="text-secondary small mb-4">
            {{ error.description or 'The page or resource you requested does not exist on this server.' }}
        </p>
        <a href="{{ url_for('products.catalog') }}" class="btn btn-primary-gradient">Explore Catalog</a>
    </div>
</div>
{% endblock %}
