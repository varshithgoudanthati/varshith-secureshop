{% extends "base.html" %}

{% block title %}Sign In — SecureShop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-6 mb-2">🔐</div>
                    <h2 class="h4 text-light fw-bold">Sign In to SecureShop</h2>
                    <p class="text-muted small">Enter your credentials or use a seeded lab account below.</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                    <div class="mb-3">
                        <label for="username" class="form-label text-light small fw-semibold">Username</label>
                        <input type="text" class="form-control form-control-dark" id="username" name="username" value="{{ username or '' }}" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-light small fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-dark" id="password" name="password" required>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label text-secondary small" for="remember">
                            Remember my session
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary-gradient w-100 py-2 fw-semibold">
                        Sign In
                    </button>
                </form>

                <!-- Quick-Fill Lab Helper Buttons -->
                <div class="mt-4 pt-3 border-top border-secondary">
                    <p class="text-secondary small mb-2 text-center fw-semibold">⚡ Lab Test Autofill:</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-sm btn-outline-warning" onclick="fillCredentials('admin', 'AdminPass123!')">
                            Admin
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-info" onclick="fillCredentials('alice', 'AlicePass123!')">
                            Alice
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillCredentials('bob', 'BobPass123!')">
                            Bob
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">
                        Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-info text-decoration-none">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
